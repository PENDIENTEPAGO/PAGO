<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - Pago Pendiente</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f6f7f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      padding-left: 4px;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      background: #200020;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 14px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      color: #200020;
    }

    /* Card Principal */
    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      margin-bottom: 16px;
    }

    .monto-label {
      font-size: 15px;
      color: #6b7280;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .monto-val {
      font-size: 34px;
      font-weight: 800;
      color: #200020;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #6b7280;
      background-color: #f9fafb;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 4px;
    }

    .info-row strong {
      color: #374151;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
      margin: 24px 0 16px 0;
    }

    /* Caja del Método de Pago (Estilo Nequi) */
    .payment-option {
      border: 2px solid #200020;
      background: #faf5ff;
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .option-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .option-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-nequi {
      background-color: #200020;
      color: #ffffff;
      font-weight: bold;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      letter-spacing: 0.5px;
    }

    .option-details {
      display: flex;
      flex-direction: column;
    }

    .option-name {
      font-weight: 700;
      font-size: 16px;
      color: #200020;
    }

    .option-sub {
      font-size: 13px;
      color: #6b7280;
    }

    .radio-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #200020;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .radio-icon::after {
      content: "";
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
    }

    /* Caja de la Llave Bre-B */
    .llave-container {
      background: #ffffff;
      border: 1px dashed #d8b4fe;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .llave-info {
      display: flex;
      flex-direction: column;
    }

    .llave-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #6b7280;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .llave-text {
      font-family: monospace;
      font-size: 15px;
      font-weight: 700;
      color: #200020;
      word-break: break-all;
    }

    /* Botón Principal */
    .btn-copiar {
      width: 100%;
      background: #200020;
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(32, 0, 32, 0.25);
    }

    .btn-copiar:hover {
      background: #3b003b;
      transform: translateY(-1px);
    }

    .btn-copiar:active {
      transform: translateY(0);
    }

    /* Notificación Toast */
    .toast {
      position: fixed;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: #10b981;
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      transition: bottom 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      bottom: 30px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand-header">
      <div class="brand-logo">N</div>
      <div class="brand-title" id="txt-header">PAGO PENDIENTE</div>
    </div>

    <div class="card">
      <div class="monto-label">Monto a pagar</div>
      <div class="monto-val" id="txt-monto">$100,000</div>
      
      <div class="info-row">
        <span>Cliente / Titular:</span>
        <strong id="txt-nombre">NOMBRE XXXXXXXX XXXXXXXX</strong>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Método de Pago</div>

      <div class="payment-option">
        <div class="option-header">
          <div class="option-brand">
            <div class="badge-nequi">NEQUI</div>
            <div class="option-details">
              <span class="option-name">Llave Bre-B / Nequi</span>
              <span class="option-sub">Billetera Digital</span>
            </div>
          </div>
          <div class="radio-icon"></div>
        </div>

        <div class="llave-container">
          <div class="llave-info">
            <span class="llave-label">Llave para transferir</span>
            <span class="llave-text" id="txt-llave">@PRUEBA0000000000000</span>
          </div>
        </div>

        <button class="btn-copiar" onclick="copiarLlave()">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
          </svg>
          COPIAR LLAVE BRE-B
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">
    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
    </svg>
    ¡Llave copiada al portapapeles!
  </div>

  <script>
    // Extraer variables dinámicas de la URL si existen
    const params = new URLSearchParams(window.location.search);
    
    const header = params.get('header') || 'PAGO PENDIENTE';
    const nombre = params.get('nombre') || 'NOMBRE XXXXXXXX XXXXXXXX';
    const llave  = params.get('llave')  || '@PRUEBA0000000000000';
    const monto  = params.get('monto')  || '100000';

    // Formatear monto como moneda colombiana
    const montoFormateado = isNaN(monto) ? monto : '$' + Number(monto).toLocaleString('es-CO');

    // Inyectar valores en el HTML
    document.getElementById('txt-header').innerText = header;
    document.getElementById('txt-nombre').innerText = nombre;
    document.getElementById('txt-llave').innerText = llave;
    document.getElementById('txt-monto').innerText = montoFormateado;

    // Función para copiar la llave al portapapeles
    function copiarLlave() {
      const textoLlave = document.getElementById('txt-llave').innerText;
      navigator.clipboard.writeText(textoLlave).then(() => {
        mostrarToast();
      }).catch(err => {
        const inputTemp = document.createElement('input');
        inputTemp.value = textoLlave;
        document.body.appendChild(inputTemp);
        inputTemp.select();
        document.execCommand('copy');
        document.body.removeChild(inputTemp);
        mostrarToast();
      });
    }

    function mostrarToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }
  </script>
</body>
</html>
